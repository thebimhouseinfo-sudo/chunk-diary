name: M0-M1 Legacy Snapshot Integrity

on:
  push:
    branches: [codex/supabase-app]
    paths:
      - 'src/db/legacyCompatibility.ts'
      - 'src/db/legacySnapshot.ts'
      - 'tests/legacy-compat.test.ts'
      - 'tests/legacy-snapshot.test.ts'
      - 'tests/fixtures/beta-v4.fixture.json'
      - 'docs/contracts/BETA_DATA_V4.md'
      - 'docs/contracts/BETA_BACKUP_V1.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/m0-legacy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install lockfile dependencies
        run: npm ci
      - name: Install pinned IndexedDB test emulator (no package-lock mutation)
        run: npm install --no-save --package-lock=false fake-indexeddb@6.2.5
      - name: Type-check project
        run: npm run lint
      - name: Run beta-v4 + real IndexedDB emulator regression / negative controls
        run: npm run test:legacy
