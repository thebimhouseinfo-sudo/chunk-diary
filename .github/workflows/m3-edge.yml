name: M3 Private Edge Gateway Checks

on:
  push:
    branches: [codex/supabase-app]
    paths:
      - 'supabase/functions/generate-chunks/**'
      - 'server.ts'
      - 'src/utils/aiService.ts'
      - '.github/workflows/m3-edge.yml'
      - 'docs/contracts/PRIVATE_AI_GATEWAY.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Edge Function types
        run: deno check --node-modules-dir=auto supabase/functions/generate-chunks/index.ts
      - name: Auth and quota fail-closed tests (no secrets)
        run: deno test --node-modules-dir=auto --allow-env --allow-net supabase/functions/generate-chunks/index_test.ts
      - name: Staging Edge denies invalid JWT without a provider call
        run: |
          STATUS="$(curl -sS --max-time 20 -o /tmp/chunkdiary_unauth.json -w '%{http_code}' \
            -X POST "https://nwowifnlfgcmmoiglgmu.supabase.co/functions/v1/generate-chunks" \
            -H "content-type: application/json" \
            -H "authorization: Bearer not-a-valid-jwt" \
            --data '{"contractVersion":"2","requestId":"aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa","diaryContent":"synthetic fixture","nativeLanguage":"Vietnamese","targetLanguage":"Japanese","existingSemanticGroups":[]}' )"
          echo "Staging invalid-token HTTP status: $STATUS"
          if [ "$STATUS" != "401" ] && [ "$STATUS" != "403" ]; then
            echo "Staging Edge did not reject invalid JWT"
            exit 1
          fi
          # No secrets are exposed, no valid token exists, and no Gemini call is made.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile legacy Express development server without prompts
        run: npm run build:server
